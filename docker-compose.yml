services:
  db:
    image: postgres:16-alpine
    container_name: confess-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: confesshub
      POSTGRES_PASSWORD: confesshub
      POSTGRES_DB: confesshub
    ports:
      - "5433:5432"
    volumes:
      - confesshub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confesshub -d confesshub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  confesshub_postgres_data:
